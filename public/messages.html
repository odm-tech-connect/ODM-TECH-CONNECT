<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messagerie — ODM TECH CONNECT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f4f6f9;color:#10243a}
.header{background:#168bd2;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.header a{color:#fff;text-decoration:none;margin-left:16px}
.container{max-width:1000px;margin:20px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:300px 1fr;gap:16px;height:70vh}
.sidebar{background:#fff;border-radius:12px;overflow-y:auto;border:1px solid #e0e6ee}
.chat-area{background:#fff;border-radius:12px;display:flex;flex-direction:column;border:1px solid #e0e6ee}
.search-box{padding:12px;border-bottom:1px solid #e0e6ee}
.search-box input{width:100%;padding:10px;border:1px solid #d0d8e4;border-radius:8px;font-size:14px}
.conv-item{padding:14px;cursor:pointer;border-bottom:1px solid #f0f3f7}
.conv-item:hover{background:#f4f6f9}
.conv-item.active{background:#e8f1fb}
.conv-item .name{font-weight:600;font-size:14px}
.conv-item .preview{font-size:12px;color:#6b7a90;margin-top:4px}
.conv-item .unread{background:#168bd2;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;float:right}
.chat-header{padding:16px;border-bottom:1px solid #e0e6ee;font-weight:600}
.chat-messages{flex:1;overflow-y:auto;padding:16px}
.msg{max-width:70%;padding:10px 14px;border-radius:12px;margin-bottom:8px;font-size:14px}
.msg.sent{background:#168bd2;color:#fff;margin-left:auto}
.msg.received{background:#f0f3f7}
.msg .time{font-size:10px;opacity:0.7;margin-top:4px}
.chat-input{padding:12px;border-top:1px solid #e0e6ee;display:flex;gap:8px}
.chat-input input{flex:1;padding:12px;border:1px solid #d0d8e4;border-radius:8px;font-size:14px}
.chat-input button{padding:12px 24px;background:#168bd2;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.chat-input button:hover{background:#1278b8}
.empty{text-align:center;padding:40px;color:#6b7a90}
@media(max-width:700px){.grid{grid-template-columns:1fr;height:auto}.sidebar{max-height:200px}}
</style>
</head>
<body>
<div class="header">
<h2>ODM TECH CONNECT — Messagerie</h2>
<div>
<a href="/">Accueil</a>
<a href="/messages.html">Messages</a>
<a href="#" id="logoutLink">Déconnexion</a>
</div>
</div>
<div class="container">
<div class="grid">
<div class="sidebar">
<div class="search-box">
<input type="text" id="searchInput" placeholder="Rechercher un utilisateur..." oninput="searchUsers()">
<div id="searchResults"></div>
</div>
<div id="conversationList"></div>
</div>
<div class="chat-area">
<div class="chat-header" id="chatHeader">Sélectionnez une conversation</div>
<div class="chat-messages" id="chatMessages">
<div class="empty">Recherchez un utilisateur ou sélectionnez une conversation pour commencer.</div>
</div>
<div class="chat-input" id="chatInput" style="display:none">
<input type="text" id="messageInput" placeholder="Votre message..." onkeypress="if(event.key==='Enter')sendMessage()">
<button onclick="sendMessage()">Envoyer</button>
</div>
</div>
</div>
</div>
<script>
let currentUserId=null;
let currentUser=null;
let pollTimer=null;

async function checkSession(){
try{
const res=await fetch('/api/auth/me');
if(!res.ok){window.location.href='/';return;}
const data=await res.json();
currentUser=data.user;
loadConversations();
}catch(e){window.location.href='/';}
}

async function loadConversations(){
try{
const res=await fetch('/api/messages');
const convs=await res.json();
const list=document.getElementById('conversationList');
list.innerHTML='';
if(convs.length===0){
list.innerHTML='<div class="empty">Aucune conversation.<br>Recherchez un utilisateur ci-dessus.</div>';
return;
}
convs.forEach(c=>{
const div=document.createElement('div');
div.className='conv-item';
div.onclick=()=>openConversation(c.other_user_id,c.other_user_name||c.other_user_email);
const unread=c.unread_count>0?`<span class="unread">${c.unread_count}</span>`:'';
div.innerHTML=`<div class="name">${unread}${c.other_user_name||c.other_user_email}</div><div class="preview">${(c.last_message||'').substring(0,50)}</div>`;
list.appendChild(div);
});
}catch(e){console.error(e);}
}

async function searchUsers(){
const q=document.getElementById('searchInput').value.trim();
if(q.length<2){document.getElementById('searchResults').innerHTML='';return;}
try{
const res=await fetch('/api/messages/search?q='+encodeURIComponent(q));
const users=await res.json();
const div=document.getElementById('searchResults');
div.innerHTML='';
users.forEach(u=>{
const item=document.createElement('div');
item.className='conv-item';
item.innerHTML=`<div class="name">${u.name||u.email}</div>`;
item.onclick=()=>{
openConversation(u.id,u.name||u.email);
document.getElementById('searchInput').value='';
div.innerHTML='';
};
div.appendChild(item);
});
}catch(e){console.error(e);}
}

async function openConversation(userId,userName){
currentUserId=userId;
document.getElementById('chatHeader').textContent=userName;
document.getElementById('chatInput').style.display='flex';
await loadMessages(userId);
if(pollTimer)clearInterval(pollTimer);
pollTimer=setInterval(()=>loadMessages(userId),5000);
}

async function loadMessages(userId){
try{
const res=await fetch('/api/messages/'+userId);
const messages=await res.json();
const box=document.getElementById('chatMessages');
box.innerHTML='';
if(messages.length===0){
box.innerHTML='<div class="empty">Aucun message. Envoyez le premier !</div>';
return;
}
messages.forEach(m=>{
const div=document.createElement('div');
div.className='msg '+(m.sender_id===currentUser.id?'sent':'received');
div.innerHTML=`${escapeHtml(m.content)}<div class="time">${new Date(m.created_at).toLocaleString('fr-FR')}</div>`;
box.appendChild(div);
});
box.scrollTop=box.scrollHeight;
}catch(e){console.error(e);}
}

async function sendMessage(){
const input=document.getElementById('messageInput');
const content=input.value.trim();
if(!content||!currentUserId)return;
input.value='';
try{
await fetch('/api/messages',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({receiverId:currentUserId,content})
});
await loadMessages(currentUserId);
loadConversations();
}catch(e){console.error(e);}
}

function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

document.getElementById('logoutLink').onclick=async(e)=>{
e.preventDefault();
await fetch('/api/auth/logout',{method:'POST'});
window.location.href='/';
};

checkSession();
</script>
</body>
</html>
